<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Wall-mounted air conditioner in a bright indoor space">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="45%" stop-color="#234859"/>
      <stop offset="100%" stop-color="#0f2a38"/>
    </linearGradient>
    <linearGradient id="light" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7ec8c4" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7ec8c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef2"/>
      <stop offset="100%" stop-color="#c5d0d8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#room)"/>
  <rect width="1600" height="1200" fill="url(#light)"/>
  <!-- wall plane -->
  <path d="M0 180 H1600 V980 H0 Z" fill="#2a4d5c" opacity="0.55"/>
  <path d="M0 980 L420 1100 L1600 900 V1200 H0 Z" fill="#0b1f2e" opacity="0.45"/>
  <!-- window light -->
  <rect x="1180" y="220" width="280" height="420" rx="8" fill="#9fd4cf" opacity="0.22"/>
  <rect x="1200" y="240" width="240" height="380" rx="4" fill="#d7f0ed" opacity="0.12"/>
  <!-- split AC indoor unit -->
  <g transform="translate(380,300)">
    <rect x="0" y="0" width="520" height="170" rx="18" fill="url(#unit)"/>
    <rect x="24" y="28" width="472" height="78" rx="8" fill="#9aadb8"/>
    <g stroke="#dfe8ed" stroke-width="3">
      <line x1="48" y1="42" x2="48" y2="92"/>
      <line x1="88" y1="42" x2="88" y2="92"/>
      <line x1="128" y1="42" x2="128" y2="92"/>
      <line x1="168" y1="42" x2="168" y2="92"/>
      <line x1="208" y1="42" x2="208" y2="92"/>
      <line x1="248" y1="42" x2="248" y2="92"/>
      <line x1="288" y1="42" x2="288" y2="92"/>
      <line x1="328" y1="42" x2="328" y2="92"/>
      <line x1="368" y1="42" x2="368" y2="92"/>
      <line x1="408" y1="42" x2="408" y2="92"/>
      <line x1="448" y1="42" x2="448" y2="92"/>
    </g>
    <rect x="36" y="122" width="120" height="18" rx="4" fill="#7a8f9b"/>
    <circle cx="460" cy="131" r="8" fill="#0f8a86"/>
  </g>
  <!-- soft airflow suggestion -->
  <g stroke="#7bd4cf" stroke-width="3" fill="none" opacity="0.35" filter="url(#soft)">
    <path d="M420 520 C520 560 640 560 760 520"/>
    <path d="M440 560 C540 600 660 600 780 560"/>
    <path d="M460 600 C560 640 680 640 800 600"/>
  </g>
  <!-- subtle service caption bar -->
  <rect x="80" y="980" width="640" height="96" rx="12" fill="#0b1f2e" opacity="0.72"/>
  <text x="112" y="1038" fill="#e8eef3" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Installation · Repair · Maintenance · Cleaning</text>
</svg>
